<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practicum.pdf</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f7; color: #111827;
      display: flex; flex-direction: column;
    }
    header, footer {
      padding: 12px 16px; max-width: 1200px; margin: 0 auto; width: 100%;
    }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    .btn {
      display: inline-block; padding: 8px 12px; margin-top: 8px;
      background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
      text-decoration: none; color: #111827;
    }
    .viewer {
      flex: 1; max-width: 1200px; width: 100%;
      margin: 8px auto 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .viewer > * { width: 100%; height: 100%; border: 0; display: block; }
    footer { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Практикум (PDF)</h1>
    <div>Прямой просмотр файла <code>practicum.pdf</code> из корня проекта.</div>
    <a class="btn" href="./practicum.pdf" target="_blank" rel="noopener">Открыть в новой вкладке</a>
  </header>

  <div class="viewer">
    <!-- Основной вариант: прямой PDF -->
    <embed src="./practicum.pdf#zoom=page-width&view=FitH&toolbar=1" type="application/pdf" />

    <!-- Фолбэк на случай, если <embed> не поддерживается браузером -->
    <object data="./practicum.pdf#zoom=page-width" type="application/pdf">
      <p style="padding:12px">
        Ваш браузер не поддерживает встроенный просмотр PDF.
        <a href="./practicum.pdf" target="_blank" rel="noopener">Откройте файл по ссылке</a>.
      </p>
    </object>
  </div>

  <footer>© INCARE</footer>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>INCARE — Practicum PDF</title>
  <style>
    :root { --maxw: 1100px; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2937; background: #f7f7f9;
    }
    header, main { max-width: var(--maxw); margin: 0 auto; padding: 20px; }
    header { padding-top: 32px; }
    h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; }
    p.subtitle { margin: 0 0 16px; color: #6b7280; }
    .actions { margin: 12px 0 20px; }
    .btn {
      display: inline-block; padding: 10px 14px; border-radius: 10px; text-decoration: none;
      border: 1px solid #d1d5db; background: white; color: #111827;
    }
    .viewer-wrap {
      position: relative; width: 100%; height: 85vh; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    footer { max-width: var(--maxw); margin: 10px auto 30px; padding: 0 20px; color: #6b7280; font-size: 12px; }
    .note { margin-top: 10px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Практикум (PDF)</h1>
    <p class="subtitle">Встроенный просмотр с возможностью пролистывания страниц.</p>
    <div class="actions">
      <!-- Прямая ссылка на файл в корне Pages -->
      <a class="btn" href="./practicum.pdf" target="_blank" rel="noopener">Открыть в новой вкладке</a>
    </div>
  </header>

  <main>
    <!-- Вариант через Google Docs Viewer (надежно для встраивания) -->
    <div class="viewer-wrap">
      <iframe
        src="https://docs.google.com/gview?embedded=1&url=https%3A%2F%2Fkrisdaberg.github.io%2FINCARE%2Fpracticum.pdf"
        allow="fullscreen"
      ></iframe>
    </div>

    <p class="note">
      Если вы переименуете файл, замените <code>practicum.pdf</code> в ссылке выше на новое имя
      и убедитесь, что файл лежит в корне репозитория.
    </p>
  </main>

  <footer>
    © INCARE
  </footer>
</body>
</html>

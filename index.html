<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practicum PDF</title>
  <style>
    :root { --w: 1100px; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111827; background: #f7f7f9;
    }
    header, main { max-width: var(--w); margin: 0 auto; padding: 16px; }
    header { padding-top: 28px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .btn {
      display: inline-block; margin: 10px 0 18px; padding: 10px 14px;
      background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
      text-decoration: none; color: #111827;
    }
    .viewer {
      height: 85vh; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden;
    }
    iframe, object { width: 100%; height: 100%; border: 0; display: block; }
    .fallback { padding: 12px 0; color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Практикум (PDF)</h1>
    <a class="btn" href="./practicum.pdf" target="_blank" rel="noopener">Открыть в новой вкладке</a>
  </header>

  <main>
    <!-- Вариант 1: прямое встраивание (работает в большинстве браузеров) -->
    <div class="viewer">
      <object data="./practicum.pdf#view=FitH" type="application/pdf">
        <!-- Вариант 2 (запасной): Google Docs Viewer. Раскомментируйте iframe ниже, если direct-встраивание не отображается. -->
        <!--
        <iframe src="https://docs.google.com/gview?embedded=1&url=https%3A%2F%2Fkrisdaberg.github.io%2FINCARE%2Fpracticum.pdf"></iframe>
        -->
        <div class="fallback">
          Не удалось отобразить PDF во встроенном окне.
          <a href="./practicum.pdf" target="_blank" rel="noopener">Откройте файл по прямой ссылке</a>.
        </div>
      </object>
    </div>
  </main>
</body>
</html>
